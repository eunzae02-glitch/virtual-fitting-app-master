<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@200;300;400;500;700&family=Archivo:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Gothic A1', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #111111; } a:hover { color: #767676; }
    .lat { font-family: 'Archivo', system-ui, sans-serif; font-variant-numeric: tabular-nums; }
    .eyebrow { font-family: 'Archivo', sans-serif; font-size: 10px; font-weight: 500; letter-spacing: .16em; color: #999999; }
    @keyframes sweep { 0% { transform: translateY(-100%); } 100% { transform: translateY(400%); } }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    .sweep { animation: sweep 2.6s cubic-bezier(.4,0,.2,1) infinite; }
    .pulse { animation: pulse 1.8s ease-in-out infinite; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #ffffff; color: #111111; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 15px 20px 13px;">
    <div style="width: 19px;"></div>
    <span class="eyebrow" style="color: #111111;">GENERATING</span>
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </div>

  <div style="position: relative; width: 390px; height: 400px; background: #f4f4f4; overflow: hidden; flex-shrink: 0;">
    <img src="fitting_alt.jpg" alt="" style="width: 390px; height: 560px; object-fit: cover; object-position: 50% 14%; display: block; filter: grayscale(1) contrast(.92); opacity: .32;">
    <div class="sweep" style="position: absolute; left: 0; right: 0; top: 0; height: 96px; background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.55) 45%, rgba(255,255,255,0) 100%);"></div>
    <div style="position: absolute; left: 20px; right: 20px; top: 50%; height: 1px; background: #111111; opacity: .18;"></div>
  </div>

  <div style="padding: 34px 20px 0;">
    <div style="display: flex; align-items: baseline; gap: 8px;">
      <span class="lat" style="font-size: 44px; font-weight: 300; line-height: 1; letter-spacing: -.02em;">42</span>
      <span style="font-size: 15px; font-weight: 300; color: #767676;">초 남았어요</span>
    </div>
    <div style="font-size: 13px; font-weight: 300; color: #999999; margin-top: 10px;">
      화면을 벗어나도 계속 만들어집니다
    </div>
  </div>

  <div style="padding: 30px 20px 0;">
    <div style="width: 100%; height: 2px; background: #f0f0f0; overflow: hidden;">
      <div style="width: 46%; height: 100%; background: #111111;"></div>
    </div>
  </div>

  <div style="padding: 28px 20px 0; display: flex; flex-direction: column; gap: 0;">

    <div style="display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid #f6f6f6;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 7"/></svg>
      <span style="flex: 1; font-size: 13px; font-weight: 300;">사진에서 몸 영역 찾기</span>
      <span class="lat" style="font-size: 11px; color: #c4c4c4;">1.2s</span>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid #f6f6f6;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 7"/></svg>
      <span style="flex: 1; font-size: 13px; font-weight: 300;">옷 입힐 영역 잡기</span>
      <span class="lat" style="font-size: 11px; color: #c4c4c4;">0.9s</span>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid #f6f6f6;">
      <div class="pulse" style="width: 15px; display: flex; justify-content: center;">
        <div style="width: 7px; height: 7px; border-radius: 50%; background: #111111;"></div>
      </div>
      <span style="flex: 1; font-size: 13px; font-weight: 400;">옷 합성하는 중</span>
      <span class="lat" style="font-size: 11px; color: #767676;">14 / 30</span>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 13px 0;">
      <div style="width: 15px; display: flex; justify-content: center;">
        <div style="width: 7px; height: 7px; border-radius: 50%; border: 1px solid #dcdcdc;"></div>
      </div>
      <span style="flex: 1; font-size: 13px; font-weight: 300; color: #c4c4c4;">사이즈 여유분 계산</span>
    </div>

  </div>

  <div style="flex: 1;"></div>

  <div style="margin: 0 20px 22px; background: #fafafa; padding: 15px 16px;">
    <div class="eyebrow" style="color: #767676;">TIP</div>
    <div style="font-size: 12px; font-weight: 300; color: #767676; margin-top: 8px; line-height: 1.6;">
      로고나 캐릭터가 큼직한 옷일수록 프린트가 또렷하게 나옵니다.
      작은 그림은 뭉개질 수 있어요.
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
