<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@200;300;400;500;700&family=Archivo:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Gothic A1', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #111111; } a:hover { color: #767676; }
    .lat { font-family: 'Archivo', system-ui, sans-serif; }
    .eyebrow { font-family: 'Archivo', sans-serif; font-size: 10px; font-weight: 500; letter-spacing: .16em; color: #999999; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #ffffff; color: #111111; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 14px;">
    <span class="lat" style="font-size: 19px; font-weight: 600; letter-spacing: -.01em;">FitCheck</span>
    <div style="display: flex; gap: 16px;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.4" stroke-linecap="round"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-3.4 3-6 7-6s7 2.6 7 6"/></svg>
    </div>
  </div>

  <div style="position: relative; width: 390px; height: 300px; background: #f4f4f4; overflow: hidden; flex-shrink: 0;">
    <img src="fitting_alt.jpg" alt="" style="width: 390px; height: 520px; object-fit: cover; object-position: 50% 12%; display: block;">
    <div style="position: absolute; left: 20px; bottom: 22px; color: #ffffff;">
      <div class="eyebrow" style="color: rgba(255,255,255,.72);">SIZE THEN BUY</div>
      <div style="font-size: 25px; font-weight: 300; line-height: 1.34; letter-spacing: -.02em; margin-top: 8px; text-shadow: 0 1px 12px rgba(0,0,0,.3);">
        입어본 모습과<br>내 사이즈를 같이
      </div>
    </div>
  </div>

  <div style="padding: 0;">
    <button style="width: 100%; height: 58px; background: #111111; color: #ffffff; border: none; font-family: 'Gothic A1', sans-serif; font-size: 15px; font-weight: 400; letter-spacing: -.01em; cursor: pointer;">새로 피팅하기</button>
  </div>

  <div style="padding: 26px 20px 0;">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <span class="eyebrow" style="color: #111111;">MY SIZE</span>
      <span style="font-size: 11px; font-weight: 300; color: #767676; border-bottom: 1px solid #d4d4d4; padding-bottom: 1px;">수정</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; padding-top: 15px;">
      <div>
        <div style="font-size: 10px; font-weight: 300; color: #999999;">키</div>
        <div class="lat" style="font-size: 18px; font-weight: 400; margin-top: 4px;">175</div>
      </div>
      <div>
        <div style="font-size: 10px; font-weight: 300; color: #999999;">어깨</div>
        <div class="lat" style="font-size: 18px; font-weight: 400; margin-top: 4px;">45</div>
      </div>
      <div>
        <div style="font-size: 10px; font-weight: 300; color: #999999;">가슴</div>
        <div class="lat" style="font-size: 18px; font-weight: 400; margin-top: 4px;">96</div>
      </div>
      <div>
        <div style="font-size: 10px; font-weight: 300; color: #999999;">허리</div>
        <div class="lat" style="font-size: 18px; font-weight: 400; margin-top: 4px;">80</div>
      </div>
    </div>
  </div>

  <div style="padding: 28px 20px 0; flex: 1; min-height: 0;">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <span class="eyebrow" style="color: #111111;">RECENT</span>
      <span style="font-size: 11px; font-weight: 300; color: #767676;">더보기</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; padding-top: 15px;">
      <div style="display: flex; flex-direction: column; gap: 7px;">
        <div style="width: 100%; height: 150px; background: #f4f4f4; overflow: hidden;">
          <img src="fitting_result.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; object-position: 50% 16%; display: block;">
        </div>
        <div style="display: flex; align-items: center; gap: 6px;">
          <span class="lat" style="font-size: 12px; font-weight: 600;">M</span>
          <span style="font-size: 10px; font-weight: 300; color: #767676;">레귤러</span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 7px;">
        <div style="width: 100%; height: 150px; background: #f4f4f4; overflow: hidden;">
          <img src="fitting_alt.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; object-position: 50% 32%; display: block;">
        </div>
        <div style="display: flex; align-items: center; gap: 6px;">
          <span class="lat" style="font-size: 12px; font-weight: 600;">L</span>
          <span style="font-size: 10px; font-weight: 300; color: #767676;">루즈</span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 7px;">
        <div style="width: 100%; height: 150px; background: #fafafa; display: flex; align-items: center; justify-content: center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c4c4c4" stroke-width="1.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </div>
        <span style="font-size: 10px; font-weight: 300; color: #999999;">추가</span>
      </div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #f0f0f0; padding: 11px 0 20px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span style="font-size: 9px; font-weight: 400;">홈</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#c4c4c4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l4 15H5L9 5"/><path d="M9 5a3 3 0 0 0 6 0"/></svg>
      <span style="font-size: 9px; font-weight: 300; color: #c4c4c4;">옷장</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#c4c4c4" stroke-width="1.4" stroke-linecap="round"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-3.4 3-6 7-6s7 2.6 7 6"/></svg>
      <span style="font-size: 9px; font-weight: 300; color: #c4c4c4;">마이</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
