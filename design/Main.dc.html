<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@200;300;400;500;700&family=Archivo:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Gothic A1', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #111111; } a:hover { color: #767676; }
    .lat { font-family: 'Archivo', system-ui, sans-serif; font-variant-numeric: tabular-nums; }
    .eyebrow { font-family: 'Archivo', sans-serif; font-size: 10px; font-weight: 500; letter-spacing: .16em; color: #999999; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #ffffff; color: #111111; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 15px 20px 13px;">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19l-7-7 7-7"/></svg>
    <span class="eyebrow" style="color: #111111;">FITTING RESULT</span>
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 3v13M8 7l4-4 4 4"/></svg>
  </div>

  <div style="position: relative; width: 390px; height: 356px; background: #f4f4f4; overflow: hidden; flex-shrink: 0;">
    <img src="fitting_result.jpg" alt="피팅 결과" style="width: 390px; height: 560px; object-fit: cover; object-position: 50% 16%; display: block;">
    <div style="position: absolute; left: 0; bottom: 0; background: #111111; color: #ffffff; padding: 7px 13px;">
      <span class="lat" style="font-size: 11px; font-weight: 500; letter-spacing: .1em;">M SIZE</span>
    </div>
    <div style="position: absolute; right: 14px; bottom: 14px; display: flex; gap: 5px;">
      <div style="width: 5px; height: 5px; border-radius: 50%; background: #111111;"></div>
      <div style="width: 5px; height: 5px; border-radius: 50%; background: rgba(17,17,17,.25);"></div>
      <div style="width: 5px; height: 5px; border-radius: 50%; background: rgba(17,17,17,.25);"></div>
    </div>
  </div>

  <div style="padding: 24px 20px 0;">
    <div class="eyebrow">RECOMMENDED</div>
    <div style="display: flex; align-items: baseline; gap: 10px; margin-top: 8px;">
      <span class="lat" style="font-size: 32px; font-weight: 500; letter-spacing: -.01em; line-height: 1;">M</span>
      <span style="font-size: 17px; font-weight: 300;">레귤러 핏</span>
    </div>
  </div>

  <div style="padding: 26px 20px 0;">
    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px;">
      <span class="eyebrow" style="color: #111111;">FIT SCALE</span>
      <span style="font-size: 10px; font-weight: 300; color: #999999;">가슴단면 여유분 기준</span>
    </div>

    <div style="position: relative; height: 30px;">
      <div style="position: absolute; left: 0; right: 0; top: 11px; height: 8px; display: flex; overflow: hidden;">
        <div style="width: 14.3%; background: #ebebeb;"></div>
        <div style="width: 21.4%; background: #d6d6d6;"></div>
        <div style="width: 28.6%; background: #111111;"></div>
        <div style="width: 35.7%; background: #d6d6d6;"></div>
      </div>

      <div style="position: absolute; left: 21.4%; top: 4px; transform: translateX(-50%); width: 3px; height: 22px; background: #ffffff; border-left: 1px solid #767676; border-right: 1px solid #767676;"></div>
      <div style="position: absolute; left: 64.3%; top: 4px; transform: translateX(-50%); width: 3px; height: 22px; background: #ffffff; border-left: 1px solid #767676; border-right: 1px solid #767676;"></div>
      <div style="position: absolute; left: 85.7%; top: 4px; transform: translateX(-50%); width: 3px; height: 22px; background: #ffffff; border-left: 1px solid #767676; border-right: 1px solid #767676;"></div>

      <div style="position: absolute; left: 42.9%; top: 0; transform: translateX(-50%); width: 14px; height: 30px; display: flex; align-items: center; justify-content: center;">
        <div style="width: 14px; height: 14px; border-radius: 50%; background: #ffffff; border: 3px solid #111111;"></div>
      </div>
    </div>

    <div style="position: relative; height: 15px; margin-top: 3px;">
      <span class="lat" style="position: absolute; left: 21.4%; transform: translateX(-50%); font-size: 11px; font-weight: 500; color: #767676;">S</span>
      <span class="lat" style="position: absolute; left: 42.9%; transform: translateX(-50%); font-size: 12px; font-weight: 700;">M</span>
      <span class="lat" style="position: absolute; left: 64.3%; transform: translateX(-50%); font-size: 11px; font-weight: 500; color: #767676;">L</span>
      <span class="lat" style="position: absolute; left: 85.7%; transform: translateX(-50%); font-size: 11px; font-weight: 500; color: #c4c4c4;">XL</span>
    </div>

    <div style="display: flex; justify-content: space-between; margin-top: 9px;">
      <span style="font-size: 10px; font-weight: 300; color: #999999;">타이트</span>
      <span style="font-size: 10px; font-weight: 400; color: #111111;">레귤러</span>
      <span style="font-size: 10px; font-weight: 300; color: #999999;">오버핏</span>
    </div>
  </div>

  <div style="height: 1px; background: #f0f0f0; margin: 24px 20px 0;"></div>

  <div style="padding: 0 20px;">
    <div style="display: flex; align-items: center; padding: 14px 0; border-bottom: 1px solid #f6f6f6;">
      <span style="flex: 1; font-size: 13px; font-weight: 300; color: #767676;">가슴</span>
      <span class="lat" style="font-size: 13px; font-weight: 500;">+4.0</span>
      <span style="font-size: 11px; font-weight: 300; color: #999999; width: 22px; text-align: right;">cm</span>
    </div>
    <div style="display: flex; align-items: center; padding: 14px 0;">
      <span style="flex: 1; font-size: 13px; font-weight: 300; color: #767676;">어깨</span>
      <span class="lat" style="font-size: 13px; font-weight: 500;">±0.0</span>
      <span style="font-size: 11px; font-weight: 300; color: #999999; width: 22px; text-align: right;">cm</span>
    </div>
  </div>

  <div style="flex: 1;"></div>

  <div style="display: flex; border-top: 1px solid #f0f0f0;">
    <button style="width: 62px; height: 58px; background: #ffffff; border: none; border-right: 1px solid #f0f0f0; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
    </button>
    <button style="width: 118px; height: 58px; background: #ffffff; border: none; border-right: 1px solid #f0f0f0; font-family: 'Gothic A1', sans-serif; font-size: 14px; font-weight: 400; color: #111111; cursor: pointer;">사이즈 비교</button>
    <button style="flex: 1; height: 58px; background: #111111; color: #ffffff; border: none; font-family: 'Gothic A1', sans-serif; font-size: 14px; font-weight: 400; letter-spacing: -.01em; cursor: pointer;">다른 옷</button>
  </div>

</div>
</x-dc>
</body>
</html>
